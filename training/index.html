<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ece5d6">
<title>Becken &amp; Brust</title>
<style>
:root{--paper:#ece5d6;--card:#f7f3ea;--ink:#24313a;--ink2:#5b6468;--line:#c4b89f;--sky:#2c6893;--ochre:#c38b3a;--rust:#a4502b}
@media (prefers-color-scheme:dark){:root{--paper:#1b252c;--card:#24313a;--ink:#ebe5d8;--ink2:#b9b6ad;--line:#435560;--sky:#7fb0d3;--ochre:#dcae63;--rust:#d98a63}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.box{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:18px 24px 16px 22px;padding:30px 26px 26px}
h1{font-family:Georgia,serif;font-weight:600;font-size:1.8rem;margin:0}
.brush{display:block;height:5px;width:70px;margin:10px 0 16px;border-radius:6px 2px 8px 3px;background:var(--ochre);opacity:.75;transform:rotate(-1.2deg)}
p{margin:0 0 18px;color:var(--ink2);font-size:.95rem}
input[type=password]{width:100%;font:inherit;font-size:1rem;padding:12px 14px;border:1px solid var(--line);border-radius:14px 18px 12px 16px;background:var(--paper);color:var(--ink)}
input[type=password]:focus{outline:none;border-color:var(--ochre)}
label{display:flex;align-items:center;gap:8px;margin:14px 0 18px;font-size:.88rem;color:var(--ink2)}
button{width:100%;font:inherit;font-weight:500;font-size:1rem;padding:13px;border:0;border-radius:16px 20px 14px 18px;background:var(--sky);color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#13202a}}
button:disabled{opacity:.6}
.err{min-height:1.3em;margin-top:12px;font-size:.88rem;color:var(--rust)}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">
  <h1>Becken &amp; Brust</h1>
  <span class="brush"></span>
  <p>Bitte Passwort eingeben.</p>
  <input type="password" id="pw" autocomplete="current-password" placeholder="Passwort" required>
  <label><input type="checkbox" id="rem" checked> Auf diesem Gerät merken</label>
  <button id="go" type="submit">Öffnen</button>
  <div class="err" id="err" role="alert"></div>
</form>

  if(!(window.crypto&&crypto.subtle)){err.textContent="Dieser Browser kann die Seite nicht entschlüsseln (https nötig).";go.disabled=true;return}
  function show(html){
    var w=function(){document.open();document.write(html);document.close()};
    if(document.readyState==="complete") w(); else window.addEventListener("load",w);
  }
  function decryptWith(key){
    return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(CT)).then(function(pt){return new TextDecoder().decode(pt)});
  }
  function derive(pw){
    return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]).then(function(base){
      return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:IT,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
    });
  }
  var saved=null; try{saved=localStorage.getItem(KEY)}catch(e){}
  if(saved){
    document.getElementById("f").style.visibility="hidden";
    crypto.subtle.importKey("raw",b64(saved),{name:"AES-GCM"},false,["decrypt"]).then(decryptWith).then(show)
      .catch(function(){try{localStorage.removeItem(KEY)}catch(e){}document.getElementById("f").style.visibility="visible"});
  }
  document.getElementById("f").addEventListener("submit",function(ev){
    ev.preventDefault(); err.textContent=""; go.disabled=true; go.textContent="Einen Moment …";
    var remember=document.getElementById("rem").checked, k;
    derive(document.getElementById("pw").value).then(function(key){k=key;return decryptWith(key)}).then(function(html){
      if(remember){return crypto.subtle.exportKey("raw",k).then(function(raw){try{localStorage.setItem(KEY,toB64(raw))}catch(e){}return html})}
      return html;
    }).then(show).catch(function(){
      err.textContent="Das Passwort passt nicht."; go.disabled=false; go.textContent="Öffnen";
    });
  });
})();
</script>
