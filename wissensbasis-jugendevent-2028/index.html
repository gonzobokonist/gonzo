  function ub(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  function bu(buf){var u=new Uint8Array(buf),s="";for(var i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)}
  var err=document.getElementById("err"),go=document.getElementById("go");
  function fail(m){err.textContent=m;err.hidden=false;go.disabled=false;go.textContent="Öffnen"}
  function show(html){document.open();document.write(html);document.close()}
  async function dec(key){var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(IV)},key,ub(DATA));return new TextDecoder().decode(pt)}

  try{var saved=localStorage.getItem(KEYNAME);if(saved){crypto.subtle.importKey("raw",ub(saved),{name:"AES-GCM"},false,["decrypt"]).then(dec).then(show).catch(function(){try{localStorage.removeItem(KEYNAME)}catch(e){}})}}catch(e){}
