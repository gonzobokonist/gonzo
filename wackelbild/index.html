:root{--frost:#FFE0EC;--zucker:#FBC7DB;--pflaume:#5C0F3D;--brombeer:#6E1A4C;--mandarine:#FF9F1C;--corner:0 0 12px 0;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--pflaume);color:var(--frost);font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;padding:0 16px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top{max-width:1180px;width:100%;margin:0 auto;padding:18px 0 14px;border-bottom:1px solid rgba(255,224,236,.2)}
.brand{font-weight:900;font-size:.95rem;letter-spacing:.02em;text-transform:uppercase}
.brand sup{font-size:.6em}
main{flex:1;max-width:1180px;width:100%;margin:0 auto;display:grid;align-content:center;gap:22px;padding:48px 0}
.kicker{font-size:.78rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mandarine);margin:0}
h1{font-weight:900;font-size:clamp(3rem,13vw,7.5rem);line-height:.9;margin:0;letter-spacing:-.035em}
h1 span{color:var(--mandarine)}
.claim{font-weight:800;font-size:clamp(1.2rem,3.4vw,1.8rem);line-height:1.2;margin:0;max-width:30ch;text-wrap:balance}
.lead{margin:0;max-width:56ch;color:var(--zucker)}
form{background:var(--brombeer);border-radius:var(--corner);padding:20px;display:grid;gap:12px;max-width:460px;width:100%}
label{font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--zucker)}
.row{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1 1 200px;min-width:0;font:inherit;font-size:1rem;background:var(--pflaume);color:var(--frost);border:1.5px solid var(--zucker);padding:12px 14px;border-radius:var(--corner)}
input:focus-visible,button:focus-visible{outline:3px solid var(--mandarine);outline-offset:2px}
button{font:inherit;font-weight:800;background:var(--mandarine);color:var(--pflaume);border:0;padding:12px 18px;cursor:pointer;border-radius:var(--corner);min-height:48px}
button:disabled{opacity:.6;cursor:wait}
.msg{margin:0;font-size:.88rem;min-height:1.3em;color:var(--mandarine);font-weight:600}
footer{max-width:1180px;width:100%;margin:0 auto;padding:16px 0 24px;border-top:1px solid rgba(255,224,236,.2);font-size:.8rem;color:var(--zucker)}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
form.bad{animation:shake .35s}
@media (prefers-reduced-motion:reduce){form.bad{animation:none}}
</style>
</head>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.data));
  return new TextDecoder().decode(plain);}

f.addEventListener("submit",async e=>{e.preventDefault();btn.disabled=true;msg.textContent="Einen Moment …";
