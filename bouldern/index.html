const u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function open_(pw,silent){
  try{
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c)));
    try{sessionStorage.setItem('bl_pw',pw)}catch(e){}
    document.open();document.write(html);document.close();
  }catch(e){if(!silent)document.getElementById('err').textContent='Falsches Passwort.';}
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();document.getElementById('err').textContent='';open_(document.getElementById('pw').value);});
try{const s=sessionStorage.getItem('bl_pw');if(s)open_(s,true);}catch(e){}
</script></body></html>
