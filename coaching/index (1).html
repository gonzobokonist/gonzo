<style>
:root{--bg:#F6F4EF;--card:#FFFFFF;--ink:#1B1B1A;--muted:#3a3936;--line:#E1DCD2;--field:#F0F0F0;--accent:#1F4E79;--accent-ink:#FFFFFF;--err:#B4452C;
  --sans:Arial,"Helvetica Neue",Helvetica,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--card:#1B1E22;--ink:#ECEAE4;--muted:#C9C5BD;--line:#2E3238;--field:#262A30;--accent:#86AEDB;--accent-ink:#0F1A26;--err:#E3826A}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);display:grid;place-items:center;padding:1.25rem;
  padding-top:max(1.25rem,env(safe-area-inset-top));padding-bottom:max(1.25rem,env(safe-area-inset-bottom))}
.card{width:100%;max-width:372px;background:var(--card);padding:2.6rem 2.8rem 2.7rem;box-shadow:0 2px 6px rgba(0,0,0,.12),0 10px 30px rgba(0,0,0,.08)}
h1{font-weight:400;font-size:1.45rem;line-height:1.3;text-align:center;margin:.4rem 0 1.4rem}
.sub{text-align:center;font-size:.98rem;line-height:1.35;color:var(--muted);margin:0 0 1.2rem}
hr{border:0;border-top:1px solid var(--line);margin:0 0 1.5rem}
.field{position:relative}
.field input{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--field);border:0;border-radius:0;padding:.95rem 3rem .95rem 1rem;outline:none}
.field input::placeholder{color:#8a8780}
.field input:focus{box-shadow:inset 0 -2px 0 var(--accent)}
.eye{position:absolute;right:.55rem;top:50%;transform:translateY(-50%);background:none;border:0;padding:.35rem;cursor:pointer;color:var(--ink);line-height:0}
.eye svg{width:24px;height:24px}
.remember{display:flex;align-items:center;gap:.6rem;margin:1rem 0 1rem;font-size:1rem;cursor:pointer;user-select:none}
.remember input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
button.go{width:100%;font:inherit;font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;padding:.95rem;border:0;border-radius:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button.go:disabled{opacity:.7;cursor:wait}
.err{color:var(--err);font-size:.9rem;min-height:1.2rem;margin-top:.8rem;text-align:center}
</style></head><body>

const KEY="dj-pw";
const ICON_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
const ICON_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
const pwEl=document.getElementById("pw"),eye=document.getElementById("eye");
eye.innerHTML=ICON_OFF;
eye.onclick=()=>{const show=pwEl.type==="password";pwEl.type=show?"text":"password";eye.innerHTML=show?ICON_ON:ICON_OFF;eye.setAttribute("aria-label",show?"Hide password":"Show password");pwEl.focus();};
const dec=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:dec(DATA.salt),iterations:DATA.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:dec(DATA.iv)},key,dec(DATA.ct)));
}
function show(html){document.open();document.write(html);document.close();}
function get(s){try{return s.getItem(KEY);}catch(e){return null;}}
function del(){try{localStorage.removeItem(KEY);}catch(e){}try{sessionStorage.removeItem(KEY);}catch(e){}}
(async()=>{const pw=get(localStorage)||get(sessionStorage);if(!pw)return;
  try{show(await unlock(pw));}catch(e){del();}})();
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault();const b=document.getElementById("b"),e=document.getElementById("e"),pw=pwEl.value,rem=document.getElementById("rem").checked;
  b.disabled=true;b.textContent="Opening …";e.textContent="";
  try{const html=await unlock(pw);del();try{(rem?localStorage:sessionStorage).setItem(KEY,pw);}catch(_){}show(html);}
  catch(err){e.textContent="Wrong password.";b.disabled=false;b.textContent="Enter";pwEl.select();}
});
</script></body></html>
