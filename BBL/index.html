<title>Denkraum BBL</title>
<style>
:root{--bg:#f6f6f6;--ink:#011524;--paper:#fff;--accent:#064370;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#011524;--ink:#eef2f5;--paper:#0c2638;--accent:#2f8cff;--err:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px}
form{width:100%;max-width:360px;display:grid;gap:12px;border:1.5px solid var(--ink);background:var(--paper);padding:22px 20px}
h1{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-weight:800;text-transform:uppercase;font-size:2rem;line-height:1;margin:0}
p{margin:0;font-size:.95rem}
label{font-size:.8rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
input[type=password]{font:inherit;font-size:1.1rem;padding:12px;border:1.5px solid var(--ink);background:var(--bg);color:var(--ink);width:100%}
.rem{display:flex;gap:8px;align-items:center;font-size:.9rem;text-transform:none;letter-spacing:0;font-weight:400}
button{font:inherit;font-weight:600;font-size:1rem;padding:13px;border:0;background:var(--ink);color:var(--paper);cursor:pointer;min-height:48px}
#err{color:var(--err);min-height:1.2em}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Denkraum BBL</h1>
  <p>Kuratiert von Tom Seidel. Bitte Passwort eingeben.</p>
  <label for="pw">Passwort</label>
  <input type="password" id="pw" autocomplete="current-password" required autofocus>
  <label class="rem"><input type="checkbox" id="keep"> Auf diesem Gerät merken</label>
  <button type="submit" id="go">Öffnen</button>
  <p id="err" role="alert"></p>
</form>

const KEY="denkraum-bbl-pw";
const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
 const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.it,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
 const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.iv)},k,u(D.c));
 return new TextDecoder().decode(plain);}
async function tryOpen(pw,keep){
 const html=await open_(pw);
 try{keep?localStorage.setItem(KEY,pw):null}catch(e){}
 document.open();document.write(html);document.close();}
document.getElementById("f").addEventListener("submit",async e=>{
 e.preventDefault();const err=document.getElementById("err"),btn=document.getElementById("go");
