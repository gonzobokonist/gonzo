<style>
:root{--paper:#EDEFF3;--card:#FAFBFC;--ink:#1A1D29;--muted:#5B6172;--line:#D3D7E0;--accent:#2E42AE;--on:#fff;--err:#B3261E}
@media (prefers-color-scheme:dark){:root{--paper:#13151C;--card:#1B1E27;--ink:#E6E4DE;--muted:#9CA1AF;--line:#2C303C;--accent:#A2B2FF;--on:#10142A;--err:#F2B8B5;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
form{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.e{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
h1{font-family:Georgia,"Times New Roman",serif;font-size:30px;margin:4px 0 18px;line-height:1.1}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input[type=password]{width:100%;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:16px;padding:0 12px}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.r{display:flex;align-items:center;gap:8px;margin:12px 0 16px;font-size:14px}
button{width:100%;height:46px;border:0;border-radius:99px;background:var(--accent);color:var(--on);font-size:15px;font-weight:600;cursor:pointer}
button:disabled{opacity:.6}
.m{min-height:1.3em;margin:10px 0 0;font-size:13px;color:var(--err)}
</style></head><body>

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));const K='lesarten:pw';
async function dec(pw){const e=new TextEncoder();const base=await crypto.subtle.importKey('raw',e.encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c)))}
function show(h){document.open();document.write(h);document.close()}
const f=document.getElementById('f'),m=document.getElementById('m'),b=document.getElementById('b');
async function go(pw,remember){b.disabled=true;b.textContent='Entschlüssele …';m.textContent='';
 try{const h=await dec(pw);if(remember){try{localStorage.setItem(K,pw)}catch(e){}}show(h)}
 catch(e){b.disabled=false;b.textContent='Öffnen';if(!window.crypto||!crypto.subtle)m.textContent='Dieser Browser kann hier nicht entschlüsseln. Bitte über https öffnen.';else{m.textContent='Das Passwort stimmt nicht.';try{localStorage.removeItem(K)}catch(e){}}}}
f.addEventListener('submit',e=>{e.preventDefault();go(document.getElementById('pw').value,document.getElementById('rem').checked)});
try{const s=localStorage.getItem(K);if(s)go(s,false)}catch(e){}
</script></body></html>
