<title>Juna Handpan</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#121110;color:#ece4d6;font-family:ui-monospace,Menlo,Consolas,monospace}
  body{display:flex;align-items:center;justify-content:center;padding:20px}
  .box{width:100%;max-width:360px;background:#1c1a17;border:1px solid #3b362f;border-radius:14px;padding:26px;text-align:center}
  .logo{font-family:"Arial Black",Impact,sans-serif;font-size:30px;color:#d9cdb8;letter-spacing:.5px}
  .logo span{color:#ff5fa2}
  .sub{font-size:11px;color:#8c8377;letter-spacing:2px;margin:6px 0 22px}
  input[type=password]{width:100%;height:50px;border-radius:9px;border:1px solid #3b362f;background:#2e2a25;color:#ece4d6;font-size:18px;padding:0 14px;font-family:inherit;text-align:center}
  button{width:100%;height:50px;margin-top:12px;border:none;border-radius:9px;background:#ff5fa2;color:#1a1714;font-weight:700;font-size:16px;font-family:inherit;cursor:pointer}
  button:disabled{opacity:.6}
  label{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:14px;font-size:13px;color:#8c8377}
  label input{width:20px;height:20px;accent-color:#ff5fa2}
  .err{color:#ff7a7a;font-size:13px;min-height:18px;margin-top:12px}
</style>
</head>
<body>
<form class="box" id="f">
  <div class="logo">JUNA <span>HANDPAN</span></div>
  <div class="sub">GESCHÜTZT</div>
  <input type="password" id="pw" placeholder="Passwort" autocomplete="current-password" autofocus>
  <button id="go" type="submit">Los geht's</button>
  <label><input type="checkbox" id="rem" checked> Auf diesem Gerät merken</label>
  <div class="err" id="err"></div>
</form>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.salt),iterations:D.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.iv)},key,b64(D.ct));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();}
const KEY='junahandpan-pw';
async function tryPw(pw,remember){
  const html=await unlock(pw);
  try{if(remember)localStorage.setItem(KEY,pw);else localStorage.removeItem(KEY);}catch(e){}
  show(html);
}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.getElementById('go'),err=document.getElementById('err');
  if(!window.crypto||!crypto.subtle){err.textContent='Bitte über https öffnen.';return;}
  btn.disabled=true;btn.textContent='Moment …';err.textContent='';
  try{await tryPw(document.getElementById('pw').value,document.getElementById('rem').checked);}
  catch(x){err.textContent='Falsches Passwort';btn.disabled=false;btn.textContent="Los geht's";}
});
(async()=>{let s=null;try{s=localStorage.getItem(KEY);}catch(e){}
  if(s&&window.crypto&&crypto.subtle){try{await tryPw(s,true);}catch(e){try{localStorage.removeItem(KEY);}catch(_){}}}})();
