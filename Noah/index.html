<title>Vokabeln Orange Line 1</title>
<style>
:root{--bg:#f2f6fb;--surface:#fff;--ink:#11233a;--muted:#5b6b80;--line:#d6e0ec;--blue:#1d5fae;--orange:#e8731a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0c1622;--surface:#152335;--ink:#e7eef7;--muted:#9fb0c4;--line:#263a52;--blue:#5b9ff0;--orange:#ff9a45;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1622;--surface:#152335;--ink:#e7eef7;--muted:#9fb0c4;--line:#263a52;--blue:#5b9ff0;--orange:#ff9a45;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:16px}
form{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-top:8px solid var(--orange);border-radius:18px;padding:26px 20px;display:grid;gap:12px;box-shadow:0 6px 20px rgba(17,35,58,.08)}
h1{margin:0;font-size:1.6rem}
p{margin:0;color:var(--muted)}
input[type=password]{width:100%;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:13px 14px;font-size:1.15rem}
input[type=password]:focus{outline:none;border-color:var(--blue)}
label.rem{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.95rem}
button{border:0;border-radius:12px;padding:14px;font-size:1.05rem;font-weight:700;background:var(--blue);color:#fff;cursor:pointer}
.err{color:var(--orange);font-weight:600;min-height:1.3em}
</style>
</head>

<form id="f" autocomplete="off">

  <label class="rem"><input type="checkbox" id="rem" checked> Auf diesem Gerät merken</label>

</form>

const KEY="vok-ol1-pw";
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.it,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.ct));
  return new TextDecoder().decode(buf);
}
async function tryOpen(pw,remember){
  try{
    const html=await open(pw);
    if(remember){try{localStorage.setItem(KEY,pw);}catch(e){}}
    document.open();document.write(html);document.close();
    return true;
  }catch(e){return false;}
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const pw=document.getElementById("pw").value.trim();
  document.getElementById("err").textContent="";
  if(!window.crypto||!crypto.subtle){document.getElementById("err").textContent="Dieser Browser kann die Seite nicht öffnen.";return;}
  if(!await tryOpen(pw,document.getElementById("rem").checked)){
    document.getElementById("err").textContent="Das Passwort stimmt leider nicht.";
    try{localStorage.removeItem(KEY);}catch(e){}
  }
});
(async()=>{let s=null;try{s=localStorage.getItem(KEY);}catch(e){} if(s&&window.crypto&&crypto.subtle){await tryOpen(s,false);}})();
