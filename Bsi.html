const dec=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:dec(DATA.salt),iterations:DATA.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:dec(DATA.iv)},key,dec(DATA.ct));
  return new TextDecoder().decode(plain);
}
function show(html){document.open();document.write(html);document.close();}
(async()=>{let pw=null;try{pw=sessionStorage.getItem("lk-pw");}catch(e){}
  if(pw){try{show(await unlock(pw));return;}catch(e){try{sessionStorage.removeItem("lk-pw");}catch(_){}}}})();
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault();const b=document.getElementById("b"),e=document.getElementById("e"),pw=document.getElementById("pw").value;
  b.disabled=true;b.textContent="Entschlüssele …";e.textContent="";
  try{const html=await unlock(pw);try{sessionStorage.setItem("lk-pw",pw);}catch(_){}show(html);}
  catch(err){e.textContent="Das Passwort stimmt nicht.";b.disabled=false;b.textContent="Öffnen";}
});
