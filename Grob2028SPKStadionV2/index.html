  try{var saved=localStorage.getItem(KEYNAME);if(saved){crypto.subtle.importKey("raw",ub(saved),{name:"AES-GCM"},false,["decrypt"]).then(dec).then(show).catch(function(){try{localStorage.removeItem(KEYNAME)}catch(e){}})}}catch(e){}
  document.getElementById("f").addEventListener("submit",async function(e){
    e.preventDefault();err.hidden=true;go.disabled=true;go.textContent="Wird geöffnet …";
    try{
      var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(document.getElementById("pw").value),"PBKDF2",false,["deriveKey"]);
      var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:ub(SALT),iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},true,["decrypt"]);
      var html=await dec(key);
      if(document.getElementById("rem").checked){try{localStorage.setItem(KEYNAME,bu(await crypto.subtle.exportKey("raw",key)))}catch(e){}}
      show(html);
    }catch(x){fail("Das Passwort stimmt nicht. Bitte noch einmal versuchen.")}
  });
})();
