<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}</style>
<title>Halle 4 Begehung</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap">
<style>
/* Layout: Kopfzeile · 3D-Fenster in Halle 4 (Grundriss ↔ Augenhöhe 1,80 m) mit Werkzeugleiste · rechte Karte mit Standpunkt, Zeitstrahl und Steuerung */
:root{
  --gold:#D3AF37; --green:#64B32B; --lime:#95C11F; --i446:#3F4444;
  --ink:#0A0A0A; --ground:#F5F3F0; --card:#FFFFFF; --muted:#57544E; --soft:#E8E5E0; --line:rgba(10,10,10,.10);
  --glass:rgba(255,255,255,.93); --glass-ink:#0A0A0A; --view:#F5F3F0;
  --shadow:0 4px 16px rgba(10,10,10,.08); --corner:0 0 12px 0;
  --font:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#F3F1EC;--ground:#111312;--card:#1A1C1B;--muted:#ABA79F;--soft:#2A2D2C;--line:rgba(243,241,236,.12);--glass:rgba(24,26,25,.9);--glass-ink:#F3F1EC;--view:#111312;--shadow:0 4px 18px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--ink:#F3F1EC;--ground:#111312;--card:#1A1C1B;--muted:#ABA79F;--soft:#2A2D2C;--line:rgba(243,241,236,.12);--glass:rgba(24,26,25,.9);--glass-ink:#F3F1EC;--view:#111312;--shadow:0 4px 18px rgba(0,0,0,.45);color-scheme:dark}
:root.dk{--ink:#F3F1EC;--ground:#0B0D0C;--card:#151716;--muted:#A9A59D;--soft:#262928;--line:rgba(243,241,236,.12);--glass:rgba(16,18,17,.88);--glass-ink:#F3F1EC;--view:#050707;--shadow:0 4px 22px rgba(0,0,0,.6);color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent;transition:background-color .6s}
*{box-sizing:border-box}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button,select,input{font:inherit;color:inherit}

/* Rahmen */
.app{height:100%;display:flex;flex-direction:column;gap:12px;max-width:1680px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 14px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none}
.mark{font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;line-height:1.2}
.mark small{display:block;font-weight:500;font-size:9px;letter-spacing:.2em;color:var(--muted);margin-top:3px}
.chip{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;background:var(--ink);color:var(--ground);padding:7px 10px;border-radius:var(--corner);font-variant-numeric:tabular-nums;white-space:nowrap;max-width:52vw;overflow:hidden;text-overflow:ellipsis}
.view{flex:1;min-height:52vh;position:relative;border-radius:var(--corner);overflow:hidden;box-shadow:var(--shadow);background:var(--view);transition:background-color .6s}
.view canvas#gl,.view canvas#ov{position:absolute;inset:0;width:100%;height:100%;display:block}
.view canvas#ov{touch-action:none;cursor:grab}
.view canvas#ov:active{cursor:grabbing}

/* Werkzeuge */
.tools{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.tb{pointer-events:auto;border:0;cursor:pointer;background:var(--glass);color:var(--glass-ink);font-weight:700;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:9px 11px;border-radius:var(--corner);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tb.on{background:var(--gold);color:#0A0A0A}
.tb:focus-visible,.btn:focus-visible,.seg button:focus-visible,.li:focus-visible,.it:focus-visible,.tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.pop{position:absolute;top:52px;left:10px;width:min(330px,calc(100% - 20px));max-height:calc(100% - 64px);overflow:auto;background:var(--card);color:var(--ink);border-radius:var(--corner);box-shadow:var(--shadow);padding:14px;display:grid;gap:10px;z-index:5}
.pop.wide{width:min(400px,calc(100% - 20px))}
.pop .big{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.pop input[type=range]{width:100%;accent-color:var(--gold)}
.opt{display:grid;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0;padding-bottom:0}
.opt.two{grid-template-columns:1fr 1fr;gap:14px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:0;cursor:pointer;background:var(--soft);color:var(--ink);font-size:11px;font-weight:600;padding:7px 9px;border-radius:var(--corner)}
.seg button.on{background:var(--ink);color:var(--ground)}
.assign{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:12px}
.assign select{background:var(--soft);border:0;border-radius:var(--corner);padding:6px 8px;font-weight:700}
.note{margin:0;font-size:11px;line-height:1.45;color:var(--muted)}
.mini{position:absolute;right:10px;bottom:10px;border-radius:var(--corner);box-shadow:0 4px 16px rgba(0,0,0,.35);cursor:crosshair;touch-action:none}
.joy{position:absolute;left:18px;bottom:18px;width:118px;height:118px;border-radius:50%;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),0 4px 16px rgba(0,0,0,.25);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);touch-action:none}
.joy .knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--gold);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);max-width:min(560px,calc(100% - 32px));background:rgba(10,10,10,.88);color:#F5F3F0;font-size:12px;line-height:1.4;padding:10px 14px;border-radius:var(--corner);box-shadow:var(--shadow);pointer-events:none;text-align:center}
.loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--muted);background:var(--view)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--soft);border-top-color:var(--gold);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* Karte */
.info{background:var(--card);border-radius:var(--corner);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;max-height:40%;flex:none;transition:background-color .6s}
.info .scroll{overflow:auto;padding:16px 16px 8px;min-height:0;flex:1}
.ctrl{padding:10px 16px 14px;border-top:1px solid var(--line);display:grid;gap:8px}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.info h2{margin:6px 0 8px;font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.12;text-wrap:balance}
.lead{margin:0;font-size:14px;line-height:1.5;color:var(--muted);max-width:62ch}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.ch{font-size:10px;font-weight:700;letter-spacing:.06em;padding:5px 8px;background:var(--soft);border-radius:var(--corner);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;margin:14px 0 10px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;cursor:pointer;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:9px 8px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-bottom-color:var(--gold)}
.tabbody{display:grid;gap:12px}
.blk h3,.col h3,h3.sub{margin:0 0 4px;font-size:12px;font-weight:800;letter-spacing:.04em}
h3.sub{margin-top:14px}
.blk p{margin:0;font-size:13px;line-height:1.5;color:var(--muted)}
.items{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.it{width:100%;display:flex;gap:10px;align-items:flex-start;text-align:left;border:0;background:none;cursor:pointer;padding:6px 4px;font-size:13px;line-height:1.4;border-radius:var(--corner)}
.it:hover{background:var(--soft)}
.num{flex:none;width:24px;height:24px;display:grid;place-items:center;border:1.6px solid var(--ink);font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
.pill3{display:grid;gap:12px}
.col{padding:10px 12px;border-radius:var(--corner);background:var(--soft)}
.col h3{display:inline-block;padding:3px 8px;color:#fff;background:var(--green);border-radius:var(--corner);margin-bottom:8px}
.col.c-itz h3{background:var(--i446)}
.col.c-welt h3{background:var(--lime);color:#1D2B10}
.col p{margin:0 0 6px;font-size:13px;line-height:1.4}
.col p b{font-variant-numeric:tabular-nums;color:var(--green)}
.list{display:grid;gap:4px;margin-top:10px}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;text-align:left;border:0;background:var(--soft);cursor:pointer;padding:9px 10px;border-radius:var(--corner);font-size:13px}
.li b{font-weight:800;min-width:5.5em}
.li span{min-width:0;color:var(--ink)}
.li em{font-style:normal;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.li:hover{background:var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;border:0;cursor:pointer;text-decoration:none;padding:11px 14px;border-radius:var(--corner);background:var(--ink);color:var(--ground);display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.on{background:var(--gold);color:#0A0A0A;box-shadow:none}
.btn.small{padding:8px 10px;font-size:10px}
.hint{font-size:10px;color:var(--muted);letter-spacing:.03em;line-height:1.5}
.swap{transition:opacity .18s}.swap.out{opacity:0}

/* Polaroid */
.modal{position:fixed;inset:0;background:rgba(5,6,6,.72);display:grid;place-items:center;z-index:20;padding:16px}
.modal .sheet{background:var(--card);border-radius:var(--corner);padding:14px;display:grid;gap:10px;max-width:min(980px,100%);max-height:100%;overflow:auto}
.modal img{display:block;max-width:100%;max-height:72vh;box-shadow:0 8px 30px rgba(0,0,0,.35);transform:rotate(-.6deg)}

/* Zugang */
.gate{position:fixed;inset:0;display:grid;place-items:center;background:var(--ground);padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gate form{width:min(420px,100%);background:var(--card);border-radius:var(--corner);box-shadow:var(--shadow);padding:26px 24px;display:grid;gap:14px}
.gate h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.gate p{margin:0;font-size:13px;line-height:1.5;color:var(--muted)}
.gate input{width:100%;padding:12px 12px;border:0;border-radius:var(--corner);background:var(--soft);font-size:15px}
.gate input:focus-visible{outline:2px solid var(--gold)}
.gate .err{color:#B3261E;font-size:12px;font-weight:600}
.gate .hand{font-family:var(--hand);font-size:22px;color:var(--muted)}

@media (prefers-reduced-motion:reduce){.swap,body,.view,.info{transition:none}.spin{animation:none}}
@media (min-width:720px){
  .mark{font-size:13px}.mark small{font-size:10px}
  .info h2{font-size:26px}.lead{font-size:15px}
}
@media (min-width:980px) and (orientation:landscape){
  .app{display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-rows:auto minmax(0,1fr);gap:16px;padding-block:16px 18px}
  header.top{grid-column:1 / -1}
  .view{grid-column:1;grid-row:2;min-height:0}
  .info{grid-column:2;grid-row:2;max-height:none}
  .info .scroll{padding:22px 22px 10px}
  .ctrl{padding:12px 22px 18px}
}
@media (max-width:520px){
  .tb{padding:8px 9px;font-size:9px;letter-spacing:.08em}
  .mini{transform:scale(.8);transform-origin:right bottom}
  .opt.two{grid-template-columns:1fr}
}
#root{height:100%}

</style>
</head><body>
<div class="gate" id="gate">
  <form id="gateForm" autocomplete="off">
    <div class="mark">Das Schwarze Schaf®<small>JAT 2027 · Itzehoer Versicherungen</small></div>
    <h1>Halle 4 Begehung</h1>
    <p>Das begehbare Modell der #ITZEpoche Aktionslounges in Originalmaßen. Bitte das Passwort eingeben.</p>
    <label class="sr" for="pw">Passwort</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Passwort" required>
    <div class="err" id="gateErr" hidden>Das Passwort passt nicht. Bitte noch einmal versuchen.</div>
    <div class="row"><button class="btn" type="submit" id="gateBtn">Öffnen</button></div>
    <p class="hand">Vertraulich · Konzeptstand Oktober 2026</p>
  </form>
</div>
<div id="root" hidden></div>

  async function tryOpen(pw, silent) {
    const btn = $('gateBtn'); btn.disabled = true; btn.textContent = 'Prüfe …';
    let app = null;
    try { app = await dec(pw); } catch (e) { btn.disabled = false; btn.textContent = 'Öffnen'; if (!silent) { $('gateErr').hidden = false; $('pw').select(); } return; }
    try { sessionStorage.setItem('jat-h4', pw); } catch (e) { }
    start(app);
  }
  if (!(window.crypto && crypto.subtle)) { $('gateErr').textContent = 'Dieser Browser kann die geschützte Datei hier nicht öffnen. Bitte über https oder lokal in Chrome, Edge oder Safari öffnen.'; $('gateErr').hidden = false; return; }
  $('gateForm').addEventListener('submit', e => { e.preventDefault(); tryOpen($('pw').value.trim()); });
  try { const pw = sessionStorage.getItem('jat-h4'); if (pw) tryOpen(pw, true); } catch (e) { }
  $('pw').focus();
})();

</script>
