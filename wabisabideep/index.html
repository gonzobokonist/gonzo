<title>Wabi-Sabi Grundriss</title>
<style>
  :root { --bg:#1c1d1b; --line:#a5a69b; --muted:#7b7e76; --text:#d1ccc0; --red:#a34a3c; color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: Georgia, 'Times New Roman', serif;
         display: flex; align-items: center; justify-content: center;
         padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
  form { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 18px; }
  h1 { font-size: 1rem; font-weight: normal; letter-spacing: .2em; text-transform: uppercase; opacity: .7; }
  label { font-size: .85rem; color: var(--muted); letter-spacing: .05em; }
  input { width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--line);
          color: var(--text); font: inherit; font-size: 1.1rem; padding: 8px 0; outline: none; }
  input:focus { border-bottom-color: var(--text); }
  button { align-self: flex-start; background: none; border: 1px solid var(--line); color: var(--line);
           padding: 10px 22px; font: inherit; letter-spacing: .1em; cursor: pointer; transition: all .3s; }
  button:hover, button:focus-visible { background: var(--line); color: var(--bg); outline: none; }
  button:disabled { opacity: .5; cursor: wait; }
  .err { min-height: 1.2em; font-size: .85rem; color: var(--red); }
</style>
</head>
